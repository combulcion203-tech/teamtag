
name: Build TeamTags

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v4

      - name: Instalar Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'

      - name: Compilar plugin
        run: gradle build

      - name: Guardar el archivo JAR
        uses: actions/upload-artifact@v4
        with:
          name: TeamTags-JAR
          path: build/libs/*.jar
          if-no-files-found: error
